services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: geostatspg
      POSTGRES_DB: geostatsdb
    ports:
      - "5005:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
